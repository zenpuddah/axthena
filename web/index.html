<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axthena · Semantic review</title>
<style>
:root{color-scheme:dark;--bg:#101721;--panel:#182332;--line:#304254;--text:#e5edf7;--muted:#a5b7cb;--accent:#77c9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center}h1{font-size:22px;margin:0}h2{font-size:18px}h3{font-size:15px;margin:18px 0 6px}p{margin:7px 0}small,.muted{color:var(--muted)}button,select,input{background:#213246;border:1px solid #405771;border-radius:6px;padding:7px 9px;color:var(--text);font:inherit}button{cursor:pointer}button:hover,button:focus{border-color:var(--accent)}button.active{background:#315577}input[type=search]{width:100%}a{color:var(--accent)}.toolbar{display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}.toolbar label{display:flex;gap:6px;align-items:center}.workspace{display:grid;grid-template-columns:280px minmax(390px,1fr) 420px;min-height:600px;height:calc(100vh - 176px)}aside,.detail{overflow:auto;padding:15px;background:var(--panel)}aside{border-right:1px solid var(--line)}.detail{border-left:1px solid var(--line)}main{position:relative;overflow:hidden}.report{width:100%;display:block;text-align:left;margin:7px 0;background:#1b2a3d}.report.selected{border-color:#77c9ff;background:#2b435e}.report small{display:block}.list-title{display:flex;justify-content:space-between;align-items:center}.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:20px;font-size:12px;margin:2px}.notice{background:#273750;border-left:3px solid #f0b74b;padding:9px 12px;font-size:12px}#graph{width:100%;height:100%;touch-action:none}#graph .node{cursor:pointer}#graph .node text{fill:#e8f3ff;font-size:12px;paint-order:stroke;stroke:#14202d;stroke-width:4px;stroke-linejoin:round}#graph .edge{stroke:#526b83;stroke-width:1.4;fill:none;opacity:.75}#graph .edge-label{font-size:9px;fill:#a5bad1}#graph .selected circle{stroke:white;stroke-width:3}#graph .node:focus circle{stroke:white;stroke-width:4}.legend{position:absolute;bottom:10px;left:12px;right:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;pointer-events:none;background:#101721d9;padding:5px 8px;border-radius:5px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.graph-actions{position:absolute;top:10px;left:10px;display:flex;gap:5px}#graph-status{position:absolute;top:50px;left:12px;font-size:12px;color:var(--muted);max-width:70%}blockquote{margin:8px 0;padding:10px 12px;border-left:3px solid #78a4cd;background:#101c2a;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101c2a;padding:10px;font-size:11px;max-height:450px;overflow:auto}details{margin:12px 0}summary{cursor:pointer;color:var(--accent)}.link{border:0;background:transparent;color:var(--accent);padding:2px 0;text-align:left;display:block}.up{color:#67d396}.down{color:#ff8c8c}.empty{padding:22px;color:var(--muted)}.source-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.metrics{margin-left:auto;font-size:12px;color:var(--muted)}#selection-title{overflow-wrap:anywhere}footer{padding:7px 20px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:1100px){.workspace{grid-template-columns:230px 1fr}.detail{position:absolute;right:0;top:165px;bottom:30px;width:370px;box-shadow:-8px 0 30px #0008}main{margin-right:0}.metrics{display:none}}@media(max-width:760px){.workspace{display:block;height:auto}aside{max-height:240px}main{height:500px}.detail{position:static;width:auto}header{display:block}}
</style></head><body>
<header><div><h1>Axthena <span class="muted">/ semantic review</span></h1><small>Report → Expression → Idea → organisation / activity · exact evidence behind every interpretation</small></div><div id="metrics" class="metrics"></div></header>
<div class="toolbar">
<label>Stock <select id="stock"><option value="">Both / full sample</option><option>NVDA.US</option><option>MSFT.US</option></select></label>
<label>Source <select id="source"><option value="">All retained sources</option></select></label>
<label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label>
<label>Time <select id="time"><option value="declared_date">Declared-date exploration</option><option value="strict">Strict exact-version availability</option></select></label>
<button id="overview">All meanings</button><button id="world">Connected world</button><button id="reset">Reset</button>
</div>
<div class="workspace"><aside><input id="search" type="search" aria-label="Search reports and meanings" placeholder="Search reports & meanings…"><div class="list-title"><h3>Retained reports</h3><span id="report-count"></span></div><div id="reports"></div><h3>Inspect node</h3><select id="node-picker" aria-label="Inspect semantic node" style="width:100%"></select><div id="coverage" class="notice"></div></aside>
<main><svg id="graph" role="img" aria-label="Interactive semantic graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="20" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a91a8"/></marker></defs><g id="scene"></g></svg><div class="graph-actions"><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="expand">Explore selected</button></div><div id="graph-status"></div><div class="legend"><span><i class="dot" style="background:#84a9ff"></i>Report / expression</span><span><i class="dot" style="background:#b99aff"></i>Idea</span><span><i class="dot" style="background:#f0a04b"></i>Organisation</span><span><i class="dot" style="background:#ecd761"></i>Subsidiary</span><span><i class="dot" style="background:#61c8d1"></i>Event / claim</span><span><i class="dot" style="background:#67d396"></i>UP</span><span><i class="dot" style="background:#f17777"></i>DOWN</span></div></main>
<section class="detail" aria-live="polite"><div id="detail"></div></section></div>
<footer id="provenance"></footer>
<script id="graph-data" type="application/json">__GRAPH__</script><script>/*__APP__*/</script></body></html>
